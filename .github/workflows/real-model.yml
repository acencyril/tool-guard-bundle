# The demo attack against a real model, on demand. Needs the repository secret HF_TOKEN
# (Hugging Face Inference Providers) or OPENROUTER_API_KEY. The transcript goes to the run summary and to an artifact.
name: Real model attack

on:
  # a push to run/real-model also runs it (with the default model)
  push:
    branches: ['run/real-model']
  workflow_dispatch:
    inputs:
      model:
        description: 'Model with tool calling (empty: the provider default)'
        default: ''
        required: false

permissions:
  contents: read

jobs:
  attack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - name: Attack
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEMO_MODEL: ${{ inputs.model }}
        run: |
          php demo/bin/console demo:attack-real-model --no-ansi | tee transcript.txt
          { echo '```'; cat transcript.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: transcript
          path: transcript.txt
